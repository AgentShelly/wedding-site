<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
/>

<style>
  :root {
    --teal-deep: #063540;
    --gold: #b0842a;
    --gold-line: rgba(176, 132, 42, 0.5);
    --hair: rgba(6, 53, 64, 0.16);
    --ink-dim: rgba(6, 53, 64, 0.7);
    --ink-faint: rgba(6, 53, 64, 0.45);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #e7e7e7;
    color: var(--teal-deep);
    font-family: "DM Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8mm;
    padding: 10mm;
    min-height: 100vh;
  }

  .hint {
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(0, 0, 0, 0.45);
    text-align: center;
    max-width: 280mm;
    line-height: 1.6;
  }
  .hint b { color: rgba(0, 0, 0, 0.72); font-weight: 500; }

  /* ---- A4 landscape: 2 tent cards side by side ---- */
  .sheet {
    width: 297mm;
    height: 210mm;
    background: #ffffff;
    position: relative;
    display: flex;
  }

  /* vertical cut guide down the centre */
  .cut {
    position: absolute;
    top: 0; bottom: 0;
    left: 148.5mm;
    border-left: 1px dashed rgba(6, 53, 64, 0.28);
    z-index: 6;
  }
  .cut span {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(90deg);
    background: #fff;
    padding: 0 3mm;
    font-size: 7.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-faint);
    white-space: nowrap;
  }

  .card {
    width: 148.5mm;
    height: 210mm;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  /* horizontal fold guide across the middle of each card */
  .card .fold {
    position: absolute;
    left: 0; right: 0;
    top: 105mm;
    border-top: 1px dashed rgba(6, 53, 64, 0.28);
    text-align: center;
    z-index: 5;
  }
  .card .fold span {
    display: inline-block;
    transform: translateY(-50%);
    background: #fff;
    padding: 0 3mm;
    font-size: 7.5px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .face { height: 105mm; overflow: hidden; }
  .face--top .panel { transform: rotate(180deg); }

  .panel {
    height: 100%;
    padding: 8mm 11mm;
    display: flex;
    align-items: center;
    gap: 10mm;
    position: relative;
  }
  .panel .frame {
    position: absolute;
    inset: 5mm;
    border: 1px solid var(--gold-line);
    pointer-events: none;
  }

  /* left — QR */
  .qr-col {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3mm;
  }
  .qr-col svg { display: block; width: 45mm; height: 45mm; }
  .scan-label {
    font-size: 8px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold);
    text-align: center;
    line-height: 1.5;
  }

  /* right — words */
  .copy {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    text-align: left;
  }
  .monogram {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 10px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--gold);
    padding-left: 0.4em;
  }
  .rule { width: 30px; height: 1px; background: var(--gold); margin: 2.5mm 0 2.5mm; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-weight: 500;
    font-size: 20px;
    line-height: 1.03;
    color: var(--teal-deep);
    text-wrap: balance;
  }
  .say {
    margin-top: 1.5mm;
    font-size: 7px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .list {
    margin-top: 3mm;
    display: flex;
    flex-direction: column;
  }
  .list li {
    list-style: none;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 3mm;
    padding: 1.7mm 0;
    border-bottom: 1px solid var(--hair);
    font-size: 8.5px;
    line-height: 1.2;
    color: var(--ink-dim);
  }
  .list li:first-child { border-top: 1px solid var(--hair); }
  .list .heart { color: var(--gold-line); flex: 0 0 auto; font-size: 9px; }

  .foot {
    margin-top: auto;
    padding-top: 3mm;
    display: flex;
    flex-direction: column;
    gap: 0.6mm;
  }
  .url { font-size: 7px; letter-spacing: 0.02em; color: var(--ink-faint); }
  .names {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--teal-deep);
    margin-top: 1.5mm;
  }
  .date {
    font-size: 6.5px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
  }

  @media print {
    body { background: #fff; padding: 0; gap: 0; min-height: 0; display: block; }
    .hint { display: none; }
    .sheet { width: 297mm; height: 210mm; flex-direction: row; }
    .card { width: 148.5mm; height: 210mm; }
    .face { height: 105mm; }
    .face--top .panel { transform: rotate(180deg); }
    @page { size: A4 landscape; margin: 0; }
  }

  @media (max-width: 620px) {
    body { padding: 4mm; }
    .sheet { width: 100%; height: auto; flex-direction: column; }
    .cut { display: none; }
    .card { width: 100%; height: auto; }
    .card .fold { display: none; }
    .face { height: auto; }
    .face--top .panel { transform: none; }
    .panel { flex-direction: column; text-align: center; }
    .copy { text-align: center; align-items: center; }
    .foot { align-items: center; }
  }
</style>

<p class="hint">
  Print <b>A4 landscape</b>, single-sided &middot; cut down the centre &middot;
  each guest folds their half in half &middot; stands as a landscape table tent
</p>

<div class="sheet" id="sheet">
  <div class="cut"><span>cut</span></div>
</div>

<script>
  const QR = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 41 41" shape-rendering="crispEdges" role="img" aria-label="QR code linking to the photo challenge upload page"><path fill="#ffffff" d="M0 0h41v41H0z"/><path stroke="#063540" d="M4 4.5h7m5 0h3m1 0h4m3 0h2m1 0h7M4 5.5h1m5 0h1m4 0h7m4 0h1m3 0h1m5 0h1M4 6.5h1m1 0h3m1 0h1m1 0h1m1 0h1m2 0h1m1 0h4m7 0h1m1 0h3m1 0h1M4 7.5h1m1 0h3m1 0h1m1 0h1m1 0h2m2 0h3m2 0h4m1 0h1m1 0h1m1 0h3m1 0h1M4 8.5h1m1 0h3m1 0h1m1 0h1m6 0h1m1 0h2m5 0h1m1 0h1m1 0h3m1 0h1M4 9.5h1m5 0h1m1 0h1m1 0h1m2 0h1m1 0h2m3 0h3m3 0h1m5 0h1M4 10.5h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7M12 11.5h2m5 0h1m5 0h4M4 12.5h1m1 0h5m6 0h3m1 0h2m3 0h1m1 0h1m1 0h5M4 13.5h1m2 0h3m4 0h1m1 0h1m3 0h1m2 0h5m2 0h2m1 0h2m1 0h1M4 14.5h2m2 0h1m1 0h2m4 0h1m2 0h1m2 0h1m2 0h1m6 0h1m1 0h1M4 15.5h2m3 0h1m1 0h1m1 0h1m4 0h1m1 0h1m4 0h4m3 0h3M5 16.5h3m1 0h2m1 0h5m2 0h1m2 0h1m2 0h1m3 0h1m2 0h2m1 0h2M9 17.5h1m3 0h4m1 0h3m3 0h4m2 0h1m2 0h1m1 0h2M4 18.5h3m1 0h1m1 0h1m4 0h1m2 0h1m2 0h3m5 0h2m1 0h1m2 0h1M4 19.5h1m1 0h3m2 0h1m1 0h1m3 0h2m1 0h1m1 0h4m1 0h1m1 0h2m1 0h3M5 20.5h3m1 0h3m1 0h1m1 0h2m3 0h5m1 0h4m1 0h2m3 0h1M4 21.5h1m1 0h2m1 0h1m2 0h2m2 0h2m2 0h2m1 0h2m1 0h2m2 0h2m1 0h2m1 0h1M6 22.5h2m1 0h3m2 0h1m1 0h2m1 0h1m1 0h1m4 0h1m3 0h3m1 0h2M4 23.5h1m3 0h2m1 0h2m5 0h1m1 0h3m1 0h1m3 0h1m2 0h5M4 24.5h1m1 0h1m1 0h3m1 0h1m1 0h4m2 0h1m2 0h7m1 0h3m1 0h1M4 25.5h1m1 0h1m2 0h1m1 0h1m1 0h1m2 0h1m1 0h2m2 0h1m2 0h1m1 0h1m2 0h2m2 0h1m1 0h1M4 26.5h1m1 0h7m1 0h1m3 0h3m1 0h1m1 0h3m1 0h1m2 0h1m1 0h3M4 27.5h1m1 0h1m5 0h1m1 0h3m2 0h1m2 0h1m2 0h2m2 0h1m1 0h1m1 0h2M4 28.5h1m1 0h2m1 0h2m1 0h4m1 0h1m1 0h1m1 0h2m3 0h1m1 0h6m1 0h2M12 29.5h1m1 0h1m1 0h1m1 0h1m4 0h3m2 0h1m3 0h1m1 0h1m1 0h1M4 30.5h7m5 0h1m1 0h2m2 0h1m1 0h2m1 0h2m1 0h1m1 0h1m1 0h2M4 31.5h1m5 0h1m1 0h1m2 0h4m1 0h1m2 0h6m3 0h5M4 32.5h1m1 0h3m1 0h1m1 0h2m4 0h2m2 0h2m1 0h1m2 0h6M4 33.5h1m1 0h3m1 0h1m1 0h1m2 0h6m3 0h3m1 0h2m2 0h1m1 0h1m1 0h1M4 34.5h1m1 0h3m1 0h1m1 0h1m1 0h1m3 0h1m2 0h3m1 0h3m2 0h2m2 0h1M4 35.5h1m5 0h1m2 0h2m1 0h2m2 0h1m1 0h4m1 0h1m1 0h2m1 0h3M4 36.5h7m1 0h5m1 0h1m1 0h4m2 0h6m1 0h1m1 0h1"/></svg>`;

  const items = [
    "The march-in &amp; tea ceremony",
    "Your table, all together",
    "A speech &mdash; or the yum seng",
    "Happy tears or a sweet moment",
    "Food, flowers, anything gold",
    "A selfie with someone you love",
    "Your shot of the night",
  ];

  const panel = () => `
    <div class="panel">
      <div class="frame"></div>
      <div class="qr-col">
        <div class="qr">${QR}</div>
        <div class="scan-label">Point your camera<br/>no app needed</div>
      </div>
      <div class="copy">
        <div class="monogram">A &nbsp;&amp;&nbsp; R</div>
        <div class="rule"></div>
        <h1>Take Our Photo Challenge</h1>
        <p class="say">Scan &middot; choose an album &middot; upload your shot</p>
        <ul class="list">
          ${items.map((t) => `<li><span>${t}</span><span class="heart">&#9825;</span></li>`).join("")}
        </ul>
        <div class="foot">
          <p class="url">alice-rudolph-2026.vercel.app/photos</p>
          <p class="names">Alice &amp; Rudolph</p>
          <p class="date">12 September 2026</p>
        </div>
      </div>
    </div>`;

  const card = () => `
    <div class="card">
      <div class="face face--top">${panel()}</div>
      <div class="fold"><span>fold</span></div>
      <div class="face face--bot">${panel()}</div>
    </div>`;

  document.getElementById("sheet").insertAdjacentHTML("beforeend", card() + card());
</script>
