# fly.toml — Tranquilo Vacation Rentals
# Deploy with: fly deploy
# Docs: https://fly.io/docs/reference/configuration/

app = "tranquilovacationrentals"
primary_region = "mia"

[build]
  dockerfile = "Dockerfile"
  # Public build-time env vars — set real values with:
  #   fly secrets set NEXT_PUBLIC_SITE_URL=https://tranquilovacationrentals.com
  [build.args]
    NEXT_PUBLIC_SITE_URL            = "https://tranquilovacationrentals.com"
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY = ""
    NEXT_PUBLIC_TURNSTILE_SITE_KEY  = ""

[env]
  PORT     = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines   = "stop"
  auto_start_machines  = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"

# Health check — matches the /api/health endpoint in the app
[[services.tcp_checks]]
  interval    = "10s"
  timeout     = "2s"
  grace_period = "5s"

[[http_checks]]
  interval   = "30s"
  timeout    = "5s"
  grace_period = "10s"
  method     = "GET"
  path       = "/api/health"
  protocol   = "http"

  [http_checks.headers]
    X-Fly-Health-Check = "1"

# Static asset caching via Fly's edge
[[statics]]
  guest_path = "/app/public"
  url_prefix = "/"
